# Testes + prints e clipes do jogo no PR (e no resumo do Actions, para o main): o dono vê sem instalar nada.
# Os arquivos vão para o branch "previews", sempre reescrito com um único commit para o repositório não crescer.
name: preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: previews-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Dependências (xvfb, OpenGL por CPU, ffmpeg)
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri ffmpeg

      - name: Cache do Godot e dos sprites da wiki
        uses: actions/cache@v4
        with:
          path: |
            .tools
            assets/wiki
          key: godot-sprites-${{ hashFiles('scripts/setup-godot.sh', 'scripts/fetch-sprites.sh') }}

      - name: Godot, sprites, cache de classes e modelos
        run: scripts/update.sh

      - name: Testes
        run: .tools/godot --headless -s tests/run.gd

      - name: Prints e clipes
        run: scripts/preview.sh

      - name: Publicar no branch previews
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
        run: |
          set -e
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch previews "$url" pv 2>/dev/null; then :; else
            mkdir pv && git -C pv init -q -b previews && git -C pv remote add origin "$url"
          fi
          rm -rf "pv/$TARGET" && mkdir -p "pv/$TARGET" && cp -r previews/. "pv/$TARGET/"
          cd pv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "previews (${TARGET} @ ${GITHUB_SHA::7})")
          git push -q -f origin "$commit:refs/heads/previews"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Resumo com imagens
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/blob/previews/${TARGET}"
          v="${GITHUB_SHA::7}"
          {
            echo "<!-- preview-bot -->"
            echo "### Previews (${v})"
            echo ""
            echo "[▶ passeio (dia, 1ª e 3ª pessoa)](${base}/passeio.mp4?raw=true) · [▶ noite](${base}/noite.mp4?raw=true) · [cenas em tamanho cheio](${base}/cenas)"
            echo ""
            echo "![folha](${base}/folha.jpg?raw=true&v=${v})"
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('body.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find((c) => c.body.includes('<!-- preview-bot -->'));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
